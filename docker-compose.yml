services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: subscription
      POSTGRES_PASSWORD: subscription_dev
      POSTGRES_DB: subscription
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - subscription_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscription -d subscription"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  subscription_pg:
